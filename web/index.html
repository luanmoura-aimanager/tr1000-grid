<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TR-1000 Controller</title>
<!-- "Arquivo > Adicionar ao Dock" do Safari: vira janela propria. O servidor
     tem que estar no ar - quem cuida disso e o LaunchAgent (instalar_agente.py). -->
<link rel="manifest" href="/web/manifest.webmanifest">
<link rel="apple-touch-icon" href="/web/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TR-1000 Controller">
<meta name="theme-color" content="#121110">
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
<header id="topo">
  <div class="marca"><span class="marca-tr">TR-1000</span><span class="marca-ctl">Controller</span></div>
  <div class="displays">
    <div class="seg"><span class="seg-rot">ptn</span><span class="seg-val" id="d-ptn">—</span></div>
    <div class="seg"><span class="seg-rot">bpm</span><span class="seg-val" id="d-bpm">—</span></div>
    <div class="seg"><span class="seg-rot">edita</span><span class="seg-val" id="d-var">—</span></div>
    <div class="seg"><span class="seg-rot">step</span><span class="seg-val" id="d-step">—</span></div>
  </div>
  <div class="leds" id="leds"></div>
  <button class="bt bt-ligar" id="b-ligar" type="button" aria-pressed="false">ON</button>
</header>
<p class="aviso-off" id="aviso-off">Desligado: a serial está livre para o TR-1000 App da Roland. Aperte <b>ON</b> para o Controller assumir a máquina, os Launchpads e as controladoras.</p>
<nav class="abas" id="abas" role="tablist" aria-label="seções"></nav>
<main id="paineis"></main>
<footer id="rodape"><span class="mono" id="msg">—</span><span class="mono fraco" id="build"></span></footer>
<script type="module" src="/web/js/app.mjs"></script>
</body>
</html>
