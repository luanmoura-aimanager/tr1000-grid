<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TR-1000 Controller</title>
<!-- "Arquivo > Adicionar ao Dock" do Safari: vira janela propria. O servidor
     tem que estar no ar - quem cuida disso e o LaunchAgent (instalar_agente.py). -->
<link rel="manifest" href="/web/manifest.webmanifest">
<link rel="apple-touch-icon" href="/web/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TR-1000 Controller">
<meta name="theme-color" content="#121110">
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
<header id="topo">
  <div class="marca"><span class="marca-tr">TR-1000</span><span class="marca-ctl">Controller</span></div>
  <div class="displays">
    <!-- o PTN e um botao: clique vira campo (Program Change, F3 12/10/2026) -->
    <button class="seg seg-bt" type="button" id="b-ptn"><span class="seg-rot" data-t="ptn">ptn</span><span class="seg-val" id="d-ptn">—</span></button>
    <input class="seg-campo mono" id="c-ptn" hidden autocomplete="off" spellcheck="false" maxlength="5">
    <button class="seg seg-bt" type="button" id="b-bpm"><span class="seg-rot" data-t="bpm">bpm</span><span class="seg-val" id="d-bpm">—</span></button>
    <input class="seg-campo mono" id="c-bpm" hidden autocomplete="off" spellcheck="false" maxlength="6" inputmode="decimal">
    <div class="seg"><span class="seg-rot" data-t="edita">edita</span><span class="seg-val" id="d-var">—</span></div>
    <div class="seg" id="s-toca"><span class="seg-rot" data-t="toca">toca</span><span class="seg-val" id="d-toca">—</span></div>
    <div class="seg"><span class="seg-rot" data-t="step">step</span><span class="seg-val" id="d-step">—</span></div>
  </div>
  <div class="leds" id="leds"></div>
  <div class="lingua" role="group" aria-label="idioma / language">
    <button class="bt bt-peq" type="button" data-lingua="pt">PT</button><button class="bt bt-peq" type="button" data-lingua="en">EN</button>
  </div>
  <!-- os modos (fase 2c): ON assume a maquina; OFF solta tudo; chuva e
       ambiente soltam so a serial e fazem ondas nos Launchpads -->
  <div class="modos" id="modos" role="group">
    <button class="bt bt-modo" type="button" data-modo="on">ON</button><button class="bt bt-modo" type="button" data-modo="off">OFF</button><button class="bt bt-modo" type="button" data-modo="chuva" data-t="chuva">chuva</button><button class="bt bt-modo" type="button" data-modo="ambiente" data-t="ambiente">ambiente</button>
  </div>
</header>
<p class="aviso-off" id="aviso-off"></p>
<nav class="abas" id="abas" role="tablist"></nav>
<main id="paineis"></main>
<footer id="rodape"><span class="mono" id="msg">—</span><span class="mono fraco" id="build"></span></footer>
<script type="module" src="/web/js/app.mjs"></script>
</body>
</html>
