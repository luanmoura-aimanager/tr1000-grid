# Testes de mesa a cada push e a cada PR.
#
# NADA aqui toca hardware: os testes nao abrem porta MIDI e nao precisam da
# TR-1000. O que este workflow protege e o que da para provar sem ela - a
# aritmetica Roland contra a unica mensagem real que temos, o parser das
# capturas, o extrator do catalogo e o portao da fase 0.
# Verde aqui NAO significa "funciona": significa "nao quebrou o que ja estava
# provado". Quem diz que funciona continua sendo o Luan na frente da maquina
# (CLAUDE.md).
name: testes

on:
  push:
  pull_request:

jobs:
  mesa:
    # 22.04 e nao ubuntu-latest: o Mac do projeto roda Python 3.9 (o do Command
    # Line Tools), e testar na mesma versao evita descobrir incompatibilidade
    # de sintaxe so quando o Luan roda (no tr8s-grid ja aconteceu com f-string
    # multilinha, que e 3.12+)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # O TestePortaoDaFase0 importa o lp_tr1000, que importa mido E rtmidi no
      # topo. Sem os dois, o teste do portao se PULA (skipTest) - e um portao
      # pulado no CI e um portao que nao existe. O python-rtmidi compila C++
      # quando nao ha wheel; estas duas bibliotecas fazem a compilacao passar
      - name: dependencias de MIDI do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev

      - name: mido e python-rtmidi
        run: python -m pip install --upgrade pip mido python-rtmidi

      # falha se algum teste foi pulado: no CI o portao TEM que rodar
      - name: testes de mesa
        shell: bash          # bash explicito = -eo pipefail: o tee nao engole a falha
        run: |
          python3 testes.py 2>&1 | tee saida.txt
          if grep -q "skipped" saida.txt; then
            echo "teste pulado no CI - o portao da fase 0 nao rodou"; exit 1
          fi
